<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mo Movahed — High Resolution Gallery</title>
    <meta http-equiv="refresh" content="0; url=https://momovahed.com/gallery">
    <link rel="canonical" href="https://momovahed.com/gallery" />
    <style>
        :root {
            --bg: #0a0a0a;
            --text: #e8e8e8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Space Mono", monospace, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            -webkit-font-smoothing: antialiased;
        }
        h1 {
            font-size: clamp(24px, 5vw, 48px);
            font-weight: 800;
            letter-spacing: -0.02em;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }
        p {
            font-size: 13px;
            letter-spacing: 0.15em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 2rem;
        }
        a {
            display: inline-block;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 14px 32px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        a:hover {
            background: #000;
            color: #fff;
            border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <h1>Mo Movahed</h1>
    <p>Redirecting to high-resolution gallery archive...</p>
    <a href="https://momovahed.com/gallery">Enter Gallery Archive &rarr;</a>
    <script>
        window.location.replace("https://momovahed.com/gallery");
    </script>
</body>
</html>
